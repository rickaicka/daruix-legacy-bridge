name: Build e Deploy - Daruix Legacy Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daruix-legacy-bridge-production
  cancel-in-progress: false

jobs:
  tests:
    name: Testes da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar e testar
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest

  build-and-push:
    name: Publicar imagem no GHCR
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rickaicka/daruix-legacy-bridge
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-tailscale:
    name: Atualizar Bridge na VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: bridge-vpn
    steps:
      - uses: actions/checkout@v4
      - name: Entrar na tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Preparar identidade SSH e known_hosts
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.TAILSCALE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TAILSCALE_KNOWN_HOSTS }}
          TARGET_HOST: ${{ secrets.TAILSCALE_HOST }}
          TARGET_USER: ${{ secrets.TAILSCALE_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?Falta TAILSCALE_SSH_KEY}"
          : "${KNOWN_HOSTS:?Falta TAILSCALE_KNOWN_HOSTS}"
          : "${TARGET_HOST:?Falta TAILSCALE_HOST}"
          : "${TARGET_USER:?Falta TAILSCALE_USER}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$TARGET_USER@$TARGET_HOST" 'echo "SSH Tailscale OK"'

      - name: Atualizar serviço existente no Compose
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.TAILSCALE_HOST }}
          TARGET_USER: ${{ secrets.TAILSCALE_USER }}
        run: |
          set -euo pipefail
          REMOTE="$TARGET_USER@$TARGET_HOST"
          SSH_ARGS=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          # O override vai para o diretório do projeto já em execução.
          scp "${SSH_ARGS[@]}" docker-compose.ghcr.yml "$REMOTE:/home/renato/daruix-bridge-vm/docker-compose.ghcr.yml"
          ssh "${SSH_ARGS[@]}" "$REMOTE" 'sh -se' <<'REMOTE_SCRIPT'
          set -eu
          cd /home/renato/daruix-bridge-vm
          test -s .env || { echo 'Arquivo .env ausente' >&2; exit 1; }
          test -r /mnt/conan/sgo/SGO/SGO_be.accdb || { echo 'Banco Access indisponível' >&2; exit 1; }
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull legacy-bridge
          docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d --no-deps --force-recreate legacy-bridge
          CID=$(docker compose -f docker-compose.yml -f docker-compose.ghcr.yml ps -q legacy-bridge)
          test -n "$CID"
          for i in $(seq 1 30); do
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$CID")
            case "$HEALTH" in
              healthy) echo 'Bridge saudável'; exit 0 ;;
              unhealthy|missing) docker logs --tail=60 "$CID"; exit 1 ;;
            esac
            sleep 5
          done
          docker logs --tail=60 "$CID"
          echo 'Timeout aguardando healthcheck' >&2
          exit 1
          REMOTE_SCRIPT
