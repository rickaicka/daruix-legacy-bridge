services:
  legacy-bridge:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx10g -XX:+ExitOnOutOfMemoryError"

    volumes:
      - ./local-data:/legacy-db:ro

    tmpfs:
      - /tmp:size=512m,mode=1777

    ports:
      - "8100:8100"

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8100/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    read_only: true

    security_opt:
      - no-new-privileges:true