# Exclusivo do host VPN/Tailscale. Não altera o compose da VPS.
services:
  legacy-bridge:
    image: ghcr.io/rickaicka/daruix-legacy-bridge:latest
    container_name: daruix-legacy-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx2g -XX:+ExitOnOutOfMemoryError"
    volumes:
      - /home/public/SGO:/legacy-db:ro
    ports:
      - "${TAILSCALE_BIND_IP:-100.91.222.100}:8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
