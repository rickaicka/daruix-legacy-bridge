services:
  legacy-bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - /mnt/conan/sgo:/legacy-db:ro
    networks:
      - bridge-private
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  bridge-private:
    driver: bridge

